scripts:
  - type: beforeRequest
  code: |-
    const token = pm.collectionVariables.get('accessToken');
    let tokenExpired = true;
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        tokenExpired = !payload.exp || payload.exp * 1000 <= Date.now() + 30000;
      } catch (error) {
        tokenExpired = true;
      }
    }
    if (!token || tokenExpired) {
      pm.sendRequest({
        url: pm.variables.replaceIn('{{baseUrl}}/api/v1/auth/login'),
        method: 'POST',
        header: { 'Content-Type': 'application/json' },
        body: {
          mode: 'raw',
          raw: JSON.stringify({
            email: pm.collectionVariables.get('loginEmail'),
            password: pm.collectionVariables.get('loginPassword'),
          }),
        },
      }, (error, response) => {
        if (error) throw error;
        pm.collectionVariables.set('accessToken', response.json().data.accessToken);
      });
    }
  language: text/javascript
